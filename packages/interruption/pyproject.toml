[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "interruption"
version = "0.1.0"
description = "Anticipatory planning for interruptions."
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "railroad[bench,procthor]",  # Using the local 'railroad' package
]

[project.entry-points."railroad.benchmarks"]
interruption = "interruption.benchmarks.bench_interruption"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
