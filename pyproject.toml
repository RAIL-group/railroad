[project]
name = "railroad-monorepo"
version = "0.2.0"
description = "Planning suite from the RAIL Group @ GMU supporting multi-agent concurrent planning under uncertainty, among other capabilities."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Local packages
    "railroad[all,bench,procthor]",
    "environments",
    "interruption",
    # External dependencies
    "matplotlib",
    "pyqt5",
    "roslibpy",
    # Testing and formatting (monorepo-level)
    "pytest-html",
    "pytest-xdist>=3.8.0",
    # ruff has no [tool.ruff] config here, so it runs on defaults; 0.16 widened the
    # default rule set enough to surface ~1400 new findings. Pin until configured.
    "ruff>=0.15.10,<0.16",
    # uv.lock is gitignored, so CI re-resolves every run; without a ceiling a new
    # ty release can break main on an unrelated commit. Bump deliberately.
    "ty>=0.0.64,<0.0.65",
]

[tool.uv.sources]
railroad = { path = "packages/railroad", editable = true }
environments = { path = "packages/environments", editable = true }
interruption = { path = "packages/interruption", editable = true }

[tool.ty.src]
exclude = ["**/scratch/**"]

[tool.ty.environment]
extra-paths = [
    "packages/railroad/src",
    "packages/environments/src",
    "packages/interruption/src",
]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:invalid escape sequence:SyntaxWarning"
]
addopts = "-v -n auto --html=data/test_logs/test_report.html --self-contained-html"
markers = [
    "slow: marks tests as slow to run (deselect with '-m \"not slow\"')"
]
testpaths = ["packages"]
norecursedirs = ["packages/environments/scratch"]
