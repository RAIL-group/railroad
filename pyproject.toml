[project]
name = "railroad-monorepo"
version = "0.2.0"
description = "Planning suite from the RAIL Group @ GMU supporting multi-agent concurrent planning under uncertainty, among other capabilities."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Local packages
    "railroad[all]",
    "environments",
    # External dependencies
    "matplotlib",
    "pyqt5",
    "roslibpy",
    # Testing and formatting (monorepo-level)
    "pytest-html",
    "pytest-xdist>=3.8.0",
    # Ruff runs on defaults (there is no [tool.ruff] config); 0.16's wider
    # default rule set surfaces ~1400 findings. Lift once rules are configured.
    "ruff>=0.15.10,<0.16",
    # uv.lock is gitignored, so CI re-resolves every run. The ceiling stops a
    # new ty release from breaking main on an unrelated commit; bump deliberately.
    "ty>=0.0.75,<0.0.76",
]

[tool.uv.sources]
railroad = { path = "packages/railroad", editable = true }
environments = { path = "packages/environments", editable = true }

[tool.ty.src]
exclude = ["**/scratch/**"]

[tool.ty.environment]
extra-paths = [
    "packages/railroad/src",
    "packages/environments/src",
]

[tool.pytest.ini_options]
# worksteal: workers draw from a shared queue, but it is drained in a single
# pass at startup -- each worker takes an even slice up front, and from then on
# rebalancing is stealing from the tail of another worker's queue. So collection
# order decides which slow tests share a worker, which is why conftest.py deals
# the `slow` ones one to the head of each slice: the long poles (the ProcTHOR
# integration tests, ~25s each) start immediately and in parallel, instead of
# stacking up on one worker and leaving the rest idle at the end.
addopts = "-v -n auto --dist worksteal --html=data/test_logs/test_report.html --self-contained-html"

markers = [
    "slow: marks tests as slow to run (deselect with '-m \"not slow\"')",
    # Distinct from `slow`: these are cheap, but planner-driven, so the outcome
    # is sampled rather than fixed.
    "stochastic: outcome depends on planner sampling (deselect with '-m \"not stochastic\"')",
]
testpaths = ["packages"]
norecursedirs = ["packages/environments/scratch"]
