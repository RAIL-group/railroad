[project]
name = "railroad-monorepo"
version = "0.2.0"
description = "Planning suite from the RAIL Group @ GMU supporting multi-agent concurrent planning under uncertainty, among other capabilities."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Local packages
    "railroad[all]",
    "environments",
    # External dependencies
    "matplotlib",
    "pyqt5",
    "roslibpy",
    # Testing and formatting (monorepo-level)
    "pytest-html",
    "pytest-xdist>=3.8.0",
    # ruff has no [tool.ruff] config here, so it runs on defaults; 0.16 widened the
    # default rule set enough to surface ~1400 new findings. Pin until configured.
    "ruff>=0.15.10,<0.16",
    # uv.lock is gitignored, so CI re-resolves every run; without a ceiling a new
    # ty release can break main on an unrelated commit. Bump deliberately.
    "ty>=0.0.64,<0.0.65",
]

[tool.uv.sources]
railroad = { path = "packages/railroad", editable = true }
environments = { path = "packages/environments", editable = true }

[tool.ty.src]
exclude = ["**/scratch/**"]

[tool.ty.environment]
extra-paths = [
    "packages/railroad/src",
    "packages/environments/src",
]

[tool.pytest.ini_options]
# --dist worksteal: idle workers steal queued tests instead of being handed a
# fixed up-front slice. The default (`load`) can deal the 25s ProcTHOR test to a
# worker late and leave the rest idle -- measured 50-69s across runs, vs 54+-1s
# for worksteal. Slightly worse best case, far better worst case.
# -v: the per-test scroll, as on main. It was traded away for pytest-richer's
# progress wall; with that gone, verbose comes back rather than leaving the
# run reporting nothing but dots.
#
# pytest-richer (--rich) was removed, not just disabled: with its progress
# wall active the run intermittently died during collection with
# `KeyError: 'conftest'` or pytest's "module is already loaded with path ...
# not supposed to happen" assertion -- one xdist worker fails and the whole
# run is interrupted. It unregisters and re-registers reporter plugins at
# startup, which desyncs pytest's plugin registry from its conftest
# bookkeeping. Only reproduced on a tty, so CI never saw it while every
# interactive run hit it. Do not reintroduce it.
addopts = "-v -n auto --dist worksteal --html=data/test_logs/test_report.html --self-contained-html"

markers = [
    "slow: marks tests as slow to run (deselect with '-m \"not slow\"')",
    # Distinct from `slow`: these are planner-driven, so their outcome is
    # sampled rather than fixed. They are cheap, and were previously marked
    # `slow` -- which kept real coverage off the fast path for no time saved.
    "stochastic: outcome depends on planner sampling (deselect with '-m \"not stochastic\"')",
]
testpaths = ["packages"]
norecursedirs = ["packages/environments/scratch"]
