[project]
name = "railroad-monorepo"
version = "0.2.0"
description = "Planning suite from the RAIL Group @ GMU supporting multi-agent concurrent planning under uncertainty, among other capabilities."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Local packages
    "railroad[all]",
    "environments",
    # External dependencies
    "matplotlib",
    "pyqt5",
    "roslibpy",
    # Testing and formatting (monorepo-level)
    "pytest-html",
    "pytest-xdist>=3.8.0",
    # Live progress wall for xdist runs. It drops the warnings summary
    # (pytest_warning_recorded is a no-op: "Currently we are just dropping
    # warnings"), which is why filterwarnings=["error"] below is not optional --
    # with it, a warning fails the run and is reported in full, so nothing can
    # be silently swallowed. Only activates on a tty, so CI keeps the standard
    # reporter and its warnings summary.
    "pytest-richer",
    # ruff has no [tool.ruff] config here, so it runs on defaults; 0.16 widened the
    # default rule set enough to surface ~1400 new findings. Pin until configured.
    "ruff>=0.15.10,<0.16",
    # uv.lock is gitignored, so CI re-resolves every run; without a ceiling a new
    # ty release can break main on an unrelated commit. Bump deliberately.
    "ty>=0.0.64,<0.0.65",
]

[tool.uv.sources]
railroad = { path = "packages/railroad", editable = true }
environments = { path = "packages/environments", editable = true }

[tool.ty.src]
exclude = ["**/scratch/**"]

[tool.ty.environment]
extra-paths = [
    "packages/railroad/src",
    "packages/environments/src",
]

[tool.pytest.ini_options]
# --dist worksteal: idle workers steal queued tests instead of being handed a
# fixed up-front slice. The default (`load`) can deal the 25s ProcTHOR test to a
# worker late and leave the rest idle -- measured 50-69s across runs, vs 54+-1s
# for worksteal. Slightly worse best case, far better worst case.
# --rich: pytest-richer's progress wall, in place of the per-test scroll that
# -v produced. Silently inert without a tty (CI), where the standard reporter
# and its warnings summary take over.
addopts = "-n auto --dist worksteal --rich --html=data/test_logs/test_report.html --self-contained-html"

# Warnings are errors. The suite is warning-clean, and the reporter above hides
# warning summaries on a tty, so anything less lets a warning pass unnoticed.
# Silence one here only with a comment saying why the cause cannot be fixed.
filterwarnings = ["error"]
markers = [
    "slow: marks tests as slow to run (deselect with '-m \"not slow\"')"
]
testpaths = ["packages"]
norecursedirs = ["packages/environments/scratch"]
